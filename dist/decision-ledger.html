<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ===================================================================== themes */

  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 14px;
}
:root, :root[data-theme="paper"] {
  --bg:#F2F4F3;--surface:#FFFFFF;--surface-2:#F7F8F7;--muted-bg:#ECEFED;--grid:#DFE3E1;--border:#D9DDDB;--border-soft:#E3E7E5;--control-border:#C5CBC8;--border-strong:#8A9197;--chart-grid:#D3D8D6;
  --ink:#15181C;--text-2:#3A4148;--muted:#4D555C;--faint:#646B72;--primary:#15181C;--on-primary:#FFFFFF;--focus:#2E5BDA;
  --chrome:#15181C;--on-chrome:#F2F4F3;--chrome-muted:#B3B9BD;--chrome-line:#3A4148;--mark:#E0662B;
  --accent:#1F45B0;--highlight:#F1F5FE;--good:#0B6B5F;--good-bg:#DDF1EC;--good-fg:#0B5A50;--bad:#A3283C;--bad-bg:#F8E1E3;--bad-fg:#7E1F2F;
  --warn-bg:#F6ECD2;--warn-fg:#6E5100;--info-bg:#E3EAFB;--info-fg:#1F45B0;--neutral-bg:#E6E8EA;--neutral-fg:#4D555C;
  --code-bg:#15181C;--code-fg:#ECEFED;--code-line:#2A2F35;--code-muted:#B3B9BD;--code-gutter:#8A9197;
  --s1:#2E5BDA;--s2:#E0662B;--s3:#0E8576;--s4:#8A4FD0;--s5:#A97C00;--s6:#C2416B;--s7:#1E8FB8;--s8:#4D555C;
  --ramp1:#15181C;--ramp2:#3A4148;--ramp3:#5F676E;--ramp4:#8A9197;--ramp5:#B3B9BD;--ramp6:#D3D8D6;
  --heat1:#EEF2FC;--heat1-fg:#15181C;--heat2:#C9D6F6;--heat2-fg:#15181C;--heat3:#94AEEC;--heat3-fg:#15181C;--heat4:#3D66CC;--heat4-fg:#FFFFFF;--heat5:#1E3F9E;--heat5-fg:#FFFFFF;
  color-scheme: light;
}
:root[data-theme="night"] {
  --bg:#111316;--surface:#1A1D21;--surface-2:#20242A;--muted-bg:#23272D;--grid:#2C3137;--border:#2E333A;--border-soft:#2A2E34;--control-border:#444B53;--border-strong:#6B737B;--chart-grid:#3A4048;
  --ink:#ECEFED;--text-2:#C9CED2;--muted:#A9B0B6;--faint:#9AA1A7;--primary:#ECEFED;--on-primary:#111316;--focus:#8FB0FF;
  --chrome:#0B0D0F;--on-chrome:#ECEFED;--chrome-muted:#9AA1A7;--chrome-line:#2E333A;--mark:#FF8A4C;
  --accent:#8FB0FF;--highlight:#1E2635;--good:#5FD0B8;--good-bg:#12342E;--good-fg:#A6EBDC;--bad:#FF8A9A;--bad-bg:#3A1D22;--bad-fg:#FFC2CA;
  --warn-bg:#3A3016;--warn-fg:#F1D488;--info-bg:#1C2847;--info-fg:#A9C1FF;--neutral-bg:#2A2E34;--neutral-fg:#C9CED2;
  --code-bg:#0B0D0F;--code-fg:#ECEFED;--code-line:#23272D;--code-muted:#9AA1A7;--code-gutter:#6B737B;
  --s1:#7FA2FF;--s2:#FF9A5C;--s3:#3FC9AE;--s4:#B58CF0;--s5:#E0B43C;--s6:#F07BA0;--s7:#5CC4EC;--s8:#AEB6BD;
  --ramp1:#ECEFED;--ramp2:#B9C0C6;--ramp3:#8E969D;--ramp4:#69727A;--ramp5:#4A525A;--ramp6:#343A41;
  --heat1:#1E2635;--heat1-fg:#ECEFED;--heat2:#263A66;--heat2-fg:#ECEFED;--heat3:#34539A;--heat3-fg:#FFFFFF;--heat4:#6F92E8;--heat4-fg:#0B0D0F;--heat5:#A9C1FF;--heat5-fg:#0B0D0F;
  color-scheme: dark;
}
:root[data-theme="blueprint"] {
  --font-display: 'IBM Plex Mono', ui-monospace, monospace;
  --bg:#0F2747;--surface:#133059;--surface-2:#17386A;--muted-bg:#0C2240;--grid:#1D4072;--border:#2A4F84;--border-soft:#234775;--control-border:#4A74B0;--border-strong:#7FA3D6;--chart-grid:#3C66A3;
  --ink:#F1F6FF;--text-2:#CFDDF5;--muted:#B4C8E8;--faint:#A5BBDF;--primary:#FFFFFF;--on-primary:#0F2747;--focus:#FFB347;
  --chrome:#0A1C35;--on-chrome:#F1F6FF;--chrome-muted:#9DB4DB;--chrome-line:#2A4F84;--mark:#FFB347;
  --accent:#9CC8FF;--highlight:#1C4479;--good:#7EE0C3;--good-bg:#12403F;--good-fg:#B4F0DE;--bad:#FF9DA8;--bad-bg:#4A1F33;--bad-fg:#FFD0D6;
  --warn-bg:#4A3D17;--warn-fg:#FFE29A;--info-bg:#1C3F75;--info-fg:#CFE2FF;--neutral-bg:#22446F;--neutral-fg:#D6E2F5;
  --code-bg:#0A1C35;--code-fg:#E6EEFB;--code-line:#1A3A66;--code-muted:#9DB4DB;--code-gutter:#6488C4;
  --s1:#9CC8FF;--s2:#FFB347;--s3:#7EE0C3;--s4:#D3A6FF;--s5:#FFE07A;--s6:#FF9DB8;--s7:#6FE3FF;--s8:#C9D6EA;
  --ramp1:#F1F6FF;--ramp2:#BFD3F0;--ramp3:#8EAEDE;--ramp4:#6488C4;--ramp5:#4569A6;--ramp6:#2F5088;
  --heat1:#17386A;--heat1-fg:#F1F6FF;--heat2:#23508F;--heat2-fg:#F1F6FF;--heat3:#3570B8;--heat3-fg:#FFFFFF;--heat4:#7FB2EE;--heat4-fg:#0A1C35;--heat5:#CFE4FF;--heat5-fg:#0A1C35;
  color-scheme: dark;
}
:root[data-theme="warm"] {
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --bg:#F5F0E6;--surface:#FFFDF8;--surface-2:#F9F4EA;--muted-bg:#EDE5D6;--grid:#E2D8C5;--border:#DDD2BE;--border-soft:#E8DFCF;--control-border:#C9BBA3;--border-strong:#8F806A;--chart-grid:#D8CCB6;
  --ink:#231C14;--text-2:#4A3F33;--muted:#5C5044;--faint:#6B5E4F;--primary:#7A2E1C;--on-primary:#FFF8EE;--focus:#7A2E1C;
  --chrome:#2B211A;--on-chrome:#F5F0E6;--chrome-muted:#C9BBA3;--chrome-line:#4A3F33;--mark:#C8642B;
  --accent:#8A3B1F;--highlight:#F7EBDD;--good:#2F6B3A;--good-bg:#E0EBD9;--good-fg:#23502B;--bad:#9E2A2A;--bad-bg:#F3DCD6;--bad-fg:#7A1F1F;
  --warn-bg:#F2E3C2;--warn-fg:#6A4B0B;--info-bg:#EDE0D0;--info-fg:#7A3A1C;--neutral-bg:#E9E1D3;--neutral-fg:#5C5044;
  --code-bg:#2B211A;--code-fg:#F5F0E6;--code-line:#3E3127;--code-muted:#C9BBA3;--code-gutter:#8F806A;
  --s1:#2F5A9E;--s2:#C8642B;--s3:#2F6B3A;--s4:#7A4A9E;--s5:#A07800;--s6:#9E2A4A;--s7:#2A7F95;--s8:#6E6152;
  --ramp1:#231C14;--ramp2:#4A3F33;--ramp3:#6E6152;--ramp4:#9A8B76;--ramp5:#C2B49C;--ramp6:#DDD2BE;
  --heat1:#F6E9DC;--heat1-fg:#231C14;--heat2:#EBCBAE;--heat2-fg:#231C14;--heat3:#D99A6C;--heat3-fg:#231C14;--heat4:#B4542C;--heat4-fg:#FFF8EE;--heat5:#7A2E1C;--heat5-fg:#FFF8EE;
  color-scheme: light;
}

/* ===================================================================== base */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.45; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
fieldset { margin: 0; min-width: 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 32px; }
@media (max-width: 640px) { .wrap { padding-inline: 16px; } }
.page { padding-block: 28px 72px; }

/* type */
.mono { font-family: var(--font-mono); }
.display-xl { font-family: var(--font-display); font-size: clamp(32px, 5vw, 48px); line-height: 1.04; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
.display-l { font-family: var(--font-display); font-size: clamp(28px, 4vw, 42px); line-height: 1.06; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.display-m { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.display-s { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.display-num { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; }
.lead { font-size: 21px; line-height: 1.45; max-width: 60ch; text-wrap: pretty; }
.kicker { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin: 0; }
.small { font-size: 13px; }
.small-plus { font-size: 14px; }
.tiny { font-size: 11px; }
.strong { font-weight: 600; }
.medium { font-weight: 500; }
.normal { font-weight: 400; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.text-2 { color: var(--text-2); }
.ink { color: var(--ink); }
.good { color: var(--good); }
.bad { color: var(--bad); }
.center { text-align: center; }
.measure { max-width: 68ch; }
.pre-line { white-space: pre-line; }
.clamp-1, .clamp-2 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.clamp-1 { -webkit-line-clamp: 1; }
.clamp-2 { -webkit-line-clamp: 2; }

/* layout helpers */
.stack-xxs, .stack-xs, .stack-s, .stack-m, .stack-l { display: flex; flex-direction: column; }
.stack-xxs { gap: 2px; } .stack-xs { gap: 6px; } .stack-s { gap: 12px; } .stack-m { gap: 18px; } .stack-l { gap: 24px; }
.row-xs, .row-s { display: flex; align-items: center; }
.row-xs { gap: 6px; } .row-s { gap: 10px; }
.wrap-row { flex-wrap: wrap; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.grow, .grow-main { flex: 1 1 auto; min-width: 0; }
.split { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.split-main { flex: 999 1 640px; min-width: 0; }
.split-side { flex: 1 1 300px; min-width: 0; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 16px; }
.grid-wide { grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); }
.scroll-x { overflow-x: auto; max-width: 100%; }
.bordered { border: 1px solid var(--border-soft); border-radius: 10px; overflow: hidden; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.pad { padding: 24px; }
@media (max-width: 640px) { .pad { padding: 18px; } }
.sub-card { padding: 16px; border: 1px solid var(--border-soft); border-radius: 10px; }
.hero {
  background-color: var(--muted-bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  border-bottom: 1px solid var(--border);
}
.hero-inner { padding-block: 48px 32px; display: flex; flex-direction: column; gap: 28px; }
.hero-tight { padding-block: 22px 32px; gap: 16px; }
.hero-split { display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: flex-end; }
.hero-split > .grow-main { flex: 999 1 520px; }
.empty { background: var(--surface); border: 1px dashed var(--control-border); border-radius: var(--radius); padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.empty-inline { padding: 32px; border: 1px dashed var(--control-border); border-radius: 10px; color: var(--muted); text-align: center; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--control-border); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--border-strong); }
.btn-primary { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
.btn-primary:hover:not(:disabled) { border-color: var(--primary); filter: brightness(1.12); }
.btn-invert { border: 0; background: var(--on-chrome); color: var(--chrome); }
.btn-dashed { align-self: flex-start; border-style: dashed; border-color: var(--border-strong); }
.btn-bad { border-color: var(--bad); background: var(--bad); color: var(--surface); }
.btn-s { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn-block { width: 100%; min-height: 48px; font-size: 15px; }
.icon-btn { flex: 0 0 44px; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--control-border); background: var(--surface); color: var(--text-2); }
.icon-btn-bad { border: 0; background: none; color: var(--bad); }
.link-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; border: 0; background: none; color: var(--accent); font-size: 14px; font-weight: 600; }
.link-btn.bad { color: var(--bad); padding: 0; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0; border: 0; background: none; color: var(--text-2); font-size: 14px; font-weight: 500; }
.input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--control-border); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 15px; line-height: 1.4; }
.input::placeholder { color: var(--faint); opacity: 0.85; }
textarea.input { resize: vertical; }
.input-lg { font-size: 16px; line-height: 1.5; }
.input-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; min-height: 48px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .field-label { font-size: 13px; font-weight: 600; color: var(--text-2); display: block; }
.field-role { flex: 1 1 160px; }
.row-fields { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.row-fields > .grow-main { flex: 999 1 220px; }
/* A fieldset's title sits inside the card, styled like the side panels' kickers (floating it takes it out of the border notch). */
.legend { float: left; width: 100%; padding: 0; margin: 0; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.legend + * { clear: both; }
.legend-n { font-size: 13px; color: var(--faint); margin-right: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--control-border); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; }
.chip .mono { opacity: 0.8; }
.chip-square { border-radius: 8px; font-weight: 600; }
.chip.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.segmented { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 10px; background: var(--muted-bg); }
.segmented button { min-height: 40px; padding: 0 14px; border-radius: 7px; border: 0; background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; }
.segmented button.on { background: var(--primary); color: var(--on-primary); }
.scale { display: flex; gap: 4px; }
.scale-btn { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--control-border); background: var(--surface); color: var(--ink); font-family: var(--font-mono); font-size: 15px; font-weight: 600; }
.scale-btn.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.scale-clear { border-style: dashed; font-weight: 400; }
.alert { border-radius: 12px; padding: 16px 20px; }
.alert-bad { background: var(--bad-bg); color: var(--bad-fg); }
.alert-good { background: var(--good-bg); color: var(--good-fg); font-weight: 600; }

/* atoms */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-lg { font-size: 13px; padding: 3px 11px; }
.pill-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-proposed { background: var(--info-bg); color: var(--info-fg); }
.status-accepted { background: var(--good-bg); color: var(--good); }
.status-superseded { background: var(--neutral-bg); color: var(--neutral-fg); }
.status-deprecated { background: var(--warn-bg); color: var(--warn-fg); }
.status-rejected { background: var(--bad-bg); color: var(--bad); }
.badge { display: inline-flex; font-family: var(--font-mono); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
.revisit-none { background: var(--muted-bg); color: var(--muted); }
.revisit-overdue { background: var(--bad-bg); color: var(--bad); }
.revisit-soon { background: var(--warn-bg); color: var(--warn-fg); }
.revisit-scheduled { background: var(--muted-bg); color: var(--text-2); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-family: var(--font-mono); font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--muted-bg); color: var(--text-2); }
.tag-outline { background: var(--surface); border: 1px solid var(--border); }
.avatar { flex: 0 0 auto; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
.avatar-ring { border: 2px solid var(--surface); margin-right: -6px; }
.avatar-stack { display: flex; }
.swatch { flex: 0 0 auto; display: inline-block; border-radius: 2px; }
.dots { display: inline-flex; gap: 3px; }
.dot { display: inline-block; border-radius: 50%; border: 1.5px solid; }
.meter { display: block; height: 6px; border-radius: 3px; background: var(--border-soft); overflow: hidden; }
.meter > span { display: block; height: 100%; }
.meter-s { width: 100px; height: 5px; }
.meter-m { height: 8px; background: var(--muted-bg); }
.flag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--ink); }
.flag-solid { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.pips { display: flex; gap: 3px; }
.pip { width: 16px; height: 16px; border-radius: 3px; background: var(--border-soft); }
.pip.on { background: var(--ink); }

/* ===================================================================== header */
.chrome { background: var(--chrome); color: var(--on-chrome); }
.chrome-row { padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; background: none; border: 0; color: var(--on-chrome); }
.brand-name { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.brand-tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--chrome-muted); padding: 3px 7px; border: 1px solid var(--chrome-line); border-radius: 4px; }
.chrome-nav { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
.chrome-muted, .on-chrome-muted { color: var(--chrome-muted); }
.chrome-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; background: none; border: 0; color: var(--on-chrome); font-size: 14px; font-weight: 500; }
.theme-picker { display: flex; align-items: center; gap: 4px; padding: 3px; border: 1px solid var(--chrome-line); border-radius: 10px; }
.theme-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--chrome-muted); padding: 0 6px 0 8px; }
.theme-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; min-width: 40px; padding: 0 10px; border-radius: 7px; border: 0; background: transparent; color: var(--on-chrome); font-size: 13px; font-weight: 600; }
.theme-btn.on { background: var(--chrome-line); }
.theme-swatch { position: relative; width: 20px; height: 20px; border-radius: 50%; overflow: hidden; box-shadow: inset 0 0 0 1.5px var(--chrome-muted); }
.theme-btn.on .theme-swatch { box-shadow: inset 0 0 0 1.5px var(--on-chrome); }
.theme-swatch > span { position: absolute; right: 0; top: 0; width: 10px; height: 20px; }
.theme-swatch > i { position: absolute; left: 4px; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; }

/* ===================================================================== dashboard */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 18px 20px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); color: var(--ink); text-align: left; }
.tile.on { border-color: var(--ink); }
.tile-value { font-family: var(--font-display); font-size: 40px; line-height: 1; font-weight: 700; }
.toolbar { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.search { flex: 1 1 340px; display: flex; flex-direction: column; gap: 6px; }
.search-box { position: relative; color: var(--faint); }
.search-box svg { position: absolute; left: 14px; top: 13px; }
.search-box .input { padding-left: 42px; min-height: 46px; border-radius: 10px; }
.toolbar .chips { flex: 999 1 520px; }
.list { overflow: hidden; display: flex; flex-direction: column; }
.list-row { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; width: 100%; padding: 20px 24px; border: 0; border-bottom: 1px solid var(--border-soft); background: var(--surface); color: var(--ink); text-align: left; }
.list-row:last-child { border-bottom: 0; }
.list-row:hover { background: var(--surface-2); }
.list-main { flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.list-meta { flex: 1 1 420px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; }
.list-outcome { flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; }
.list-people { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.list-revisit { flex: 0 0 150px; display: flex; justify-content: flex-end; }
@media (max-width: 640px) { .list-row { padding: 16px; } .list-revisit { justify-content: flex-start; } }

/* ===================================================================== ADR view */
.crit-row { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 14px 0; border-top: 1px solid var(--border-soft); align-items: center; }
.crit-row > .grow-main { flex: 999 1 320px; }
.crit-weight { flex: 1 1 200px; }
.share { min-width: 40px; text-align: right; }
.acc { border-top: 1px solid var(--border-soft); }
.acc-head { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 0; border: 0; background: none; color: var(--ink); text-align: left; }
.acc-rank { width: 24px; }
.acc-title { font-size: 17px; font-weight: 600; }
.acc-score { flex: 0 0 110px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.acc-body { padding: 0 0 24px 50px; }
@media (max-width: 640px) { .acc-body { padding-left: 0; } .acc-score { flex-basis: 80px; } .meter-s { width: 72px; } }
.score-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 14px; border-bottom: 1px solid var(--border-soft); }
.score-row:last-child { border-bottom: 0; }
.score-calc { flex: 0 0 120px; text-align: right; }
.bullet { display: flex; gap: 8px; font-size: 14px; }
.bullet svg { flex: 0 0 16px; margin-top: 3px; }
.outcome { background: var(--chrome); color: var(--on-chrome); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.outcome-name { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.1; }
.hyp { display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid var(--border-soft); }
.hyp:first-of-type { padding-top: 0; border-top: 0; }
.hyp-label { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--ink); }

/* charts */
.mx-row { display: grid; border-bottom: 1px solid var(--border-soft); }
.mx-head, .mx-foot { background: var(--surface-2); }
.mx-foot { border-bottom: 0; }
.mx-cell { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.mx-cell.chosen { background: var(--highlight); }
.mx-score { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; }
.mx-num { font-size: 18px; font-weight: 600; min-width: 14px; }
.radar { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: center; }
.radar-svg { display: block; overflow: visible; }
.radar-grid path, .radar-grid line { fill: none; stroke: var(--chart-grid); stroke-width: 1; }
.radar-poly { fill-opacity: 0.1; stroke-width: 2.5; stroke-linejoin: round; }
.radar-label { font-size: 13px; font-weight: 600; fill: var(--ink); }
.radar-weight { font-family: var(--font-mono); font-size: 11px; font-weight: 400; fill: var(--muted); }
.radar-ring-label { font-family: var(--font-mono); font-size: 10px; fill: var(--faint); }
.radar-legend { flex: 1 1 220px; }
.legend-btn { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-size: 14px; text-align: left; }
.legend-btn.off { opacity: 0.55; }
.legend-swatch { flex: 0 0 14px; height: 14px; border-radius: 3px; border: 2px solid; }
.stackbar { display: flex; height: 30px; border-radius: 6px; background: var(--muted-bg); overflow: hidden; }
.stackbar > span { display: block; height: 100%; box-shadow: inset -2px 0 0 var(--surface); }
.stackbar-s { height: 14px; border-radius: 4px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-top: 10px; border-top: 1px solid var(--border-soft); }
.heat-row { display: grid; gap: 4px; }
.heat-head { padding: 4px 6px; display: flex; flex-direction: column; gap: 2px; justify-content: flex-end; line-height: 1.25; }
.heat-cell { height: 52px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 18px; font-weight: 600; }
.heat-total { height: 52px; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 18px; font-weight: 700; text-align: center; }
.heat-key { width: 30px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
.heat-none { background: var(--bg); color: var(--muted); }
.heat-1 { background: var(--heat1); color: var(--heat1-fg); }
.heat-2 { background: var(--heat2); color: var(--heat2-fg); }
.heat-3 { background: var(--heat3); color: var(--heat3-fg); }
.heat-4 { background: var(--heat4); color: var(--heat4-fg); }
.heat-5 { background: var(--heat5); color: var(--heat5-fg); }

/* ===================================================================== form */
.sol-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.sol-head { display: flex; align-items: center; gap: 8px; padding-right: 8px; background: var(--surface-2); }
.sol-toggle { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; border: 0; background: none; color: var(--ink); text-align: left; }
.sol-score { min-width: 34px; text-align: right; }
.sol-body { padding: 18px 16px; }
.score-edit { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 0; border-top: 1px solid var(--border-soft); }
.score-edit > .grow-main { flex: 999 1 200px; }
.danger-zone { padding: 4px 0; }

/* ===================================================================== markdown */
.md-shell { position: relative; background: var(--code-bg); border-radius: var(--radius); overflow: hidden; }
.md-shell.dragging { outline: 2px dashed var(--mark); outline-offset: 2px; }
.md-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--code-line); color: var(--code-fg); }
.md-muted { color: var(--code-muted); }
.md-body { display: flex; height: min(76vh, 900px); min-height: 420px; }
.md-gutter { flex: 0 0 auto; padding: 16px 10px 16px 14px; overflow: hidden; white-space: pre; text-align: right; color: var(--code-gutter); font-size: 12.5px; line-height: 22px; user-select: none; border-right: 1px solid var(--code-line); }
.md-editor { flex: 1 1 auto; min-width: 0; height: 100%; padding: 16px 18px; border: 0; outline: none; resize: none; background: var(--code-bg); color: var(--code-fg); font-size: 13.5px; line-height: 22px; tab-size: 2; white-space: pre; overflow: auto; }
.md-editor:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.md-editor::selection { background: var(--mark); color: var(--code-bg); }
.md-drop { position: absolute; inset: 44px 0 0 0; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--code-bg) 80%, transparent); color: var(--code-fg); font-weight: 600; font-size: 18px; pointer-events: none; }
.outline-btn { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; min-height: 44px; padding: 6px 10px; margin: 0 -10px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; }
.outline-btn:hover { background: var(--surface-2); }
.fmt-block { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border-soft); }
.fmt-code { display: block; white-space: pre; font-family: var(--font-mono); font-size: 12px; line-height: 1.7; color: var(--text-2); }

/* ===================================================================== toast */
.toast-host { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10; width: max-content; max-width: calc(100vw - 32px); }
.toast { padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22); }
.toast-ok { background: var(--chrome); color: var(--on-chrome); }
.toast-error { background: var(--bad-bg); color: var(--bad-fg); border: 1px solid var(--bad); }

/* Edit form: sections as vertical tabs beside the open section; tabs run across the top on narrow screens. */
.vtabs-layout { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.vtabs { flex: 0 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 16px; }
.vtab { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 600; text-align: left; }
.vtab:hover { border-color: var(--border-strong); }
.vtab.on { background: var(--highlight); border-color: var(--accent); border-left-color: var(--accent); }
.vtab-panel { flex: 999 1 420px; min-width: 0; }
@media (max-width: 640px) {
  .vtabs { flex: 1 1 100%; flex-direction: row; overflow-x: auto; position: static; }
  .vtab { flex: 0 0 auto; }
}
/* Side-panel entries that jump to their solution or criterion in the form. */
.side-link { min-width: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.side-link-text { text-decoration: underline; text-decoration-color: var(--control-border); text-underline-offset: 3px; }
.side-link:hover .side-link-text { color: var(--accent); text-decoration-color: currentColor; }
/* Open dialog. */
.modal { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--ink); box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35); }
.modal::backdrop { background: rgba(0, 0, 0, 0.45); }
.modal-body { padding: 24px; }
.drop-zone { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; min-height: 140px; padding: 20px; border: 2px dashed var(--control-border); border-radius: var(--radius); color: var(--muted); text-align: center; }
.drop-zone.on { border-color: var(--accent); background: var(--highlight); color: var(--ink); }
/* Editable tag pills under the tags box. */
.tags-edit { margin-top: 8px; }
.tag-pill { display: inline-flex; align-items: center; gap: 4px; padding-right: 2px; }
.tag-x { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 3px; background: none; color: var(--muted); cursor: pointer; }
.tag-x:hover { background: var(--muted-bg); color: var(--ink); }
/* Pros/cons: one-line items under their box, each editable on click and deletable. */
.line-list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.line-item { display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 2px 0 10px; border: 1px solid var(--border); border-left: 3px solid var(--border); border-radius: 6px; background: var(--surface); }
.line-list-good .line-item { border-left-color: var(--good); }
.line-list-bad .line-item { border-left-color: var(--bad); }
.line-item.editing { padding: 2px; }
.line-text { flex: 1 1 auto; min-width: 0; padding: 6px 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: 14px; text-align: left; cursor: text; overflow-wrap: anywhere; }
.line-text:hover { color: var(--accent); }
.line-edit { flex: 1 1 auto; min-height: 34px; }
/* Pencil links on the record page that open a section in the edit form. */
.edit-icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--faint); cursor: pointer; }
.edit-icon:hover { border-color: var(--control-border); color: var(--accent); }
/* A solution's pencil sits beside its header and shows on hover or keyboard focus (always on touch screens). */
.acc-row { display: flex; align-items: center; gap: 4px; }
.acc-row .acc-head { flex: 1 1 auto; min-width: 0; }
.acc-row .edit-icon { opacity: 0; transition: opacity 120ms; }
.acc:hover .acc-row .edit-icon, .acc-row .edit-icon:focus-visible { opacity: 1; }
@media (hover: none) { .acc-row .edit-icon { opacity: 1; } }

</style>

id: ADR-0012
title: Choose an event streaming platform
status: accepted
date: 2026-09-14
revisit: 2027-03-14
tags: data, infrastructure
decision: kafka
---

## Goal
Pick a durable event backbone so order, inventory and notification services stop calling each other synchronously, and new consumers can be added without changing producers.

## Hypothesis
- We believe: moving order and inventory events onto a managed, replayable log
- Will result in: services that can be added or changed without coordinating releases with the teams that produce events
- Measured by: a new consumer reaches production in under a day, and no event change needs a cross-team release by Q2 2027.

## People
- Priya Shah \u2014 decider
- Tom Okafor \u2014 author
- Mei Lin \u2014 consulted
- Daniel Ruiz \u2014 consulted
- Sara Kowalski \u2014 informed

## Criteria
| id | criterion | weight | description |
| --- | --- | --- | --- |
| ops | Operational burden | 5 | On-call load, upgrades and tuning for a small platform team. Higher = less burden. |
| throughput | Peak throughput | 4 | Sustains our projected seasonal peak with headroom, without re-partitioning. |
| ecosystem | Ecosystem & connectors | 3 | Ready-made sinks for the warehouse, search index and change-data capture. |
| cost | Cost at projected volume | 4 | Twelve-month run cost at forecast volume, including egress. |
| familiarity | Team familiarity | 2 | What the team already knows; affects time to first production event. |

## Solution: kafka \u2014 Managed Kafka
Hosted Kafka with tiered storage; Kafka Connect for sinks and change-data capture.

| criterion | score |
| --- | --- |
| ops | 3 |
| throughput | 5 |
| ecosystem | 5 |
| cost | 3 |
| familiarity | 4 |

Pros:
- Largest connector ecosystem
- Replay from any offset with tiered storage
- Two engineers have run it in production

Cons:
- Partition planning is still on us
- Most expensive option at low volume

## Solution: kinesis \u2014 Kinesis Data Streams
Fully managed streams with on-demand capacity.

| criterion | score |
| --- | --- |
| ops | 5 |
| throughput | 4 |
| ecosystem | 3 |
| cost | 3 |
| familiarity | 2 |

Pros:
- Nothing to operate
- Scales shards on demand

Cons:
- Shorter retention than Kafka
- Ties every consumer to one cloud SDK

## Solution: nats \u2014 NATS JetStream
Lightweight server with persistence, self-hosted on our cluster.

| criterion | score |
| --- | --- |
| ops | 4 |
| throughput | 4 |
| ecosystem | 2 |
| cost | 5 |
| familiarity | 1 |

Pros:
- Very low resource cost
- Simple subject-based routing

Cons:
- Few off-the-shelf sinks
- No one on the team has run it

## Solution: outbox \u2014 Postgres outbox + polling
Write events to an outbox table; workers poll and fan out.

| criterion | score |
| --- | --- |
| ops | 4 |
| throughput | 2 |
| ecosystem | 1 |
| cost | 5 |
| familiarity | 5 |

Pros:
- No new infrastructure
- Transactional with the business write

Cons:
- Polling load grows with every consumer
- No replay beyond table retention

## Decision
Managed Kafka scores highest overall and is the only option with sink connectors we would otherwise have to build. Operational burden is the main risk: we accept it by using the managed tier, and revisit after two quarters of on-call data.

id: ADR-0013
title: Adopt one schema format for service contracts
status: proposed
date: 2026-10-10
revisit: 
tags: api, contracts
decision: 
---

## Goal
Agree one way to describe request, response and event payloads, so that types, runtime validation and documentation all come from a single definition.

## Hypothesis
- We believe: defining every service contract once, as a schema that generates both types and validators,
- Will result in: fewer contract mismatches between services reaching production
- Measured by: contract-related incidents drop to zero for two consecutive quarters after rollout.

## People
- Priya Shah \u2014 decider
- Mei Lin \u2014 author
- Jonas Weber \u2014 consulted
- Aisha Khan \u2014 consulted
- Sara Kowalski \u2014 informed

## Criteria
| id | criterion | weight | description |
| --- | --- | --- | --- |
| types | Generated types & validation | 5 | One definition yields runtime validation and static types in TypeScript services. |
| evolution | Schema evolution rules | 4 | Clear compatibility rules for adding and deprecating fields. |
| readability | Human readability | 3 | Reviewable in a pull request without extra tooling. |
| tooling | Fit with our toolchain | 3 | Works with our TypeScript build, docs generator and API gateway. |

## Solution: typebox \u2014 TypeBox (JSON Schema)
Define schemas in TypeScript; emit standard JSON Schema for other consumers.

| criterion | score |
| --- | --- |
| types | 5 |
| evolution | 3 |
| readability | 4 |
| tooling | 5 |

Pros:
- Static types and validators from one source
- Plain JSON Schema for non-TypeScript consumers

Cons:
- Compatibility rules are a convention, not enforced

## Solution: protobuf \u2014 Protocol Buffers
IDL files compiled to typed clients; binary on the wire.

| criterion | score |
| --- | --- |
| types | 5 |
| evolution | 5 |
| readability | 2 |
| tooling | 3 |

Pros:
- Strict, well-known evolution rules
- Compact payloads

Cons:
- Code generation step in every repository
- Binary payloads are harder to debug

## Solution: avro \u2014 Avro with a registry
Schemas stored in a registry that enforces compatibility.

| criterion | score |
| --- | --- |
| types | 3 |
| evolution | 5 |
| readability | 2 |
| tooling | - |

Pros:
- Registry enforces compatibility

Cons:
- Another service to run
- Weak TypeScript support

## Solution: jsonschema \u2014 Hand-written JSON Schema
Author JSON Schema files directly and generate types from them.

| criterion | score |
| --- | --- |
| types | 2 |
| evolution | 3 |
| readability | 3 |
| tooling | 4 |

Pros:
- No new dependencies

Cons:
- Verbose to write by hand
- Types drift from schemas

## Decision

id: ADR-0011
title: Run our own feature-flag service
status: accepted
date: 2026-07-02
revisit: 2026-11-01
tags: delivery
decision: oss
---

## Goal
Ship changes dark and roll them out gradually per tenant, without a deploy for each step.

## Hypothesis
- We believe: running our own flag server with gradual, per-tenant rollouts
- Will result in: smaller, safer releases and faster rollback
- Measured by: median time to roll back a bad change falls below five minutes.

## People
- Daniel Ruiz \u2014 decider
- Sara Kowalski \u2014 author
- Tom Okafor \u2014 consulted
- Mei Lin \u2014 informed

## Criteria
| id | criterion | weight | description |
| --- | --- | --- | --- |
| targeting | Targeting rules | 4 | Percentage rollouts and per-tenant targeting. |
| selfhost | Self-hosting option | 3 | Can run inside our network for regulated tenants. |
| sdks | SDK coverage | 4 | Server and browser SDKs for the languages we use. |
| cost | Cost | 3 | Annual cost at current seat count and request volume. |

## Solution: saas \u2014 Hosted flag service
Commercial SaaS with a dashboard, audit log and experiments.

| criterion | score |
| --- | --- |
| targeting | 5 |
| selfhost | 1 |
| sdks | 5 |
| cost | 2 |

Pros:
- Polished UI and audit trail
- Experiments built in

Cons:
- No self-hosting
- Priced per seat

## Solution: oss \u2014 Open-source flag server
Self-hosted open-source server with official SDKs.

| criterion | score |
| --- | --- |
| targeting | 4 |
| selfhost | 5 |
| sdks | 4 |
| cost | 4 |

Pros:
- Runs inside our network
- No per-seat cost

Cons:
- We own upgrades and uptime

## Solution: env \u2014 Flags in environment variables
Flags as environment variables, changed by deploy.

| criterion | score |
| --- | --- |
| targeting | 1 |
| selfhost | 5 |
| sdks | 3 |
| cost | 5 |

Pros:
- Zero new tooling

Cons:
- Every change needs a deploy
- No gradual rollout

## Decision
The only option that allows self-hosting for regulated tenants while keeping gradual rollouts. Revisit once we know the real upgrade cost.

id: ADR-0009
title: Move services into a monorepo
status: accepted
date: 2026-03-20
revisit: 2026-10-01
tags: tooling, delivery
decision: mono
---

## Goal
Make cross-service changes cheap enough that we stop copying shared code between repositories.

## Hypothesis
- We believe: moving services into one repository with cached, affected-only builds
- Will result in: shared-code changes landing in one review instead of many
- Measured by: copied utility modules are gone, and p90 CI time stays under 15 minutes.

## People
- Jonas Weber \u2014 decider
- Aisha Khan \u2014 author
- Priya Shah \u2014 consulted
- Tom Okafor \u2014 consulted

## Criteria
| id | criterion | weight | description |
| --- | --- | --- | --- |
| refactor | Cross-service refactors | 5 | Change a shared library and all its callers in one reviewable change. |
| ci | CI time | 4 | Time from push to green for a typical change. |
| ownership | Ownership boundaries | 3 | Clear code ownership and access control per team. |

## Solution: mono \u2014 Monorepo with build caching
One repository; affected-only builds with a remote cache.

| criterion | score |
| --- | --- |
| refactor | 5 |
| ci | 3 |
| ownership | 3 |

Pros:
- Atomic cross-service changes
- One toolchain to maintain

Cons:
- Needs build caching to keep CI fast
- Coarser access control

## Solution: poly \u2014 One repository per service
Keep the current layout; publish shared libraries as packages.

| criterion | score |
| --- | --- |
| refactor | 2 |
| ci | 4 |
| ownership | 5 |

Pros:
- Familiar to everyone
- Fine-grained permissions

Cons:
- Version skew across services
- Shared-library changes need many pull requests

## Decision
Atomic refactors outweigh coarser permissions; the CI-time risk is mitigated with remote caching. Revisit after six months of CI data.

id: ADR-0014
title: Standardise client state on a global store
status: rejected
date: 2026-08-21
revisit: 
tags: frontend
decision: 
---

## Goal
Decide whether all client-side state should live in a single global store.

## Hypothesis
- We believe: a single global store for all client state
- Will result in: more predictable UI behaviour across teams
- Measured by: fewer state-related bugs reported per release.

## People
- Aisha Khan \u2014 decider
- Mei Lin \u2014 author
- Jonas Weber \u2014 consulted

## Criteria
| id | criterion | weight | description |
| --- | --- | --- | --- |
| boilerplate | Boilerplate | 3 | Code needed for a typical feature. Higher = less code. |
| devtools | Debugging tools | 2 | State inspection and time-travel debugging. |
| servercache | Server-state caching | 4 | Caching, refetching and invalidation of API data. |

## Solution: store \u2014 Global store library
One store with actions and reducers for all client state.

| criterion | score |
| --- | --- |
| boilerplate | 2 |
| devtools | 5 |
| servercache | 2 |

Pros:
- Excellent debugging tools
- One pattern everywhere

Cons:
- Lots of boilerplate
- Server data has to be cached by hand

## Solution: query \u2014 Query cache + local state
A query cache for server data; component state for the rest.

| criterion | score |
| --- | --- |
| boilerplate | 4 |
| devtools | 4 |
| servercache | 5 |

Pros:
- Server caching built in
- Little boilerplate

Cons:
- Two patterns to learn

## Decision
The proposal was rejected. Most of our client state is server data, which a query cache already handles with far less code.

id: ADR-0006
title: Store web sessions in Redis
status: superseded
date: 2025-11-04
revisit: 
tags: infrastructure, auth
decision: redis
---

## Goal
Choose where web sessions live so that every request can read them quickly.

## Hypothesis
- We believe: keeping sessions in a replicated Redis cluster
- Will result in: faster authenticated page loads
- Measured by: p95 session lookup stays under 2 ms.

## People
- Tom Okafor \u2014 decider
- Daniel Ruiz \u2014 author

## Criteria
| id | criterion | weight | description |
| --- | --- | --- | --- |
| latency | Read latency | 4 | Session lookup happens on every request. |
| durability | Durability | 3 | Sessions survive a node restart or failover. |
| ops | Operational burden | 3 | Extra infrastructure to run. Higher = less burden. |

## Solution: redis \u2014 Redis cluster
Sessions in a replicated Redis cluster.

| criterion | score |
| --- | --- |
| latency | 5 |
| durability | 2 |
| ops | 3 |

Pros:
- Sub-millisecond reads

Cons:
- Sessions can be lost on failover without persistence

## Solution: table \u2014 Database sessions table
Sessions in the primary Postgres database.

| criterion | score |
| --- | --- |
| latency | 2 |
| durability | 5 |
| ops | 3 |

Pros:
- Durable, no new service

Cons:
- Adds load to the primary on every request

## Decision
Chosen for read latency. Superseded when we moved to stateless signed sessions.

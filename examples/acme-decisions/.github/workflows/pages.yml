# Publishes this repo as-is to GitHub Pages (no Jekyll, so decisions.md is
# served raw for the viewer to fetch).
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: npx -y @pritzlaff/adr badge decisions.md && npx -y @pritzlaff/adr card decisions.md   # → badge.svg, card.json
        env:   # the card's links open the viewer on this site's decisions.md
          ADR_SRC: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/decisions.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

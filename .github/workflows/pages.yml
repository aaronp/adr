# Builds the app and publishes it to GitHub Pages with the examples beside it
# (no Jekyll, so the example .md files are served raw for the app to fetch).
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# The github-pages environment must allow your branch (see README).
name: Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Assemble the site
        run: |
          mkdir _site
          cp dist/index.html dist/decision-ledger.html _site/
          cp -R examples _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
